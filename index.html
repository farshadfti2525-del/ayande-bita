<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آینده من و بی‌تا</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Vazirmatn;
background:#02030a;
color:white;
overflow-x:hidden;
text-align:center;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

section{
padding:100px 20px;
opacity:0;
transform:translateY(60px) scale(0.96);
transition:1.2s ease;
}

section.show{
opacity:1;
transform:translateY(0) scale(1);
}

.gallery{
display:flex;
flex-wrap:wrap;
gap:15px;
justify-content:center;
}

.gallery img{
width:260px;
border-radius:15px;
transition:0.4s;
}
.gallery img:hover{transform:scale(1.08);}

#login{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.letter{
max-width:600px;
margin:25px auto;
background:#111;
padding:25px;
border-radius:15px;
cursor:pointer;
transition:0.4s;
position:relative;
}

.letter.active{
box-shadow:0 0 40px rgba(255,255,255,0.15);
transform:scale(1.05);
}

.letterText{
margin-top:15px;
line-height:2;
min-height:60px;
}

#countdown{font-size:32px;color:#ffd166;}

#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
z-index:10;
}
</style>
</head>

<body>

<div id="overlay"></div>

<div id="login">
<h2>رمز عشق رو وارد کن ❤️</h2>
<input id="pass" type="password">
<button onclick="check()">ورود</button>
</div>

<audio id="paperSound">
<source src="paper.mp3" type="audio/mpeg">
</audio>

<audio autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<canvas id="stars"></canvas>

<section class="reveal">
<h1>آینده‌ای که با بی‌تا جانم می‌بینم</h1>
</section>

<section class="reveal">
<h2>⏳ شمارشگر تا سالگردمون</h2>
<div id="countdown"></div>
</section>

<section class="reveal">
<h2>🚗 ماشین رویاهامون</h2>
<div class="gallery">
<img src="car.png">
</div>
</section>

<section class="reveal">
<h2>🌍 سفرها</h2>
<div class="gallery">
<img src="colombia1.jpg">
<img src="colombia2.jpg">
<img src="colombia3.jpg">
<img src="europe1.jpg">
<img src="europe2.jpg">
<img src="europe3.jpg">
<img src="ny1.jpg">
<img src="ny2.jpg">
</div>
</section>

<section class="reveal">
<h2>🏕️ طبیعت‌گردی</h2>
<div class="gallery">
<img src="desert.jpg">
<img src="waterfall.jpg">
<img src="aurora.jpg">
</div>
</section>

<section class="reveal">
<h2>💍 عروسی‌مون</h2>
<div class="gallery">
<img src="wedding.jpg">
</div>
</section>

<section class="reveal">
<h2>💌 نامه‌های عاشقانه</h2>

<div class="letter" onclick="openLetter(this,'بی‌تا… از همون لحظه اول فهمیدم قراره آینده‌م بوی تو رو بده.')">
<h3>نامه اول</h3>
<div class="letterText"></div>
</div>

<div class="letter" onclick="openLetter(this,'با تو حتی ساده‌ترین روزها هم تبدیل به خاطره‌های موندگار میشن.')">
<h3>نامه دوم</h3>
<div class="letterText"></div>
</div>

<div class="letter" onclick="openLetter(this,'یه روزی میرسه که به همه این رویاها می‌خندیم چون واقعی شدن.')">
<h3>نامه سوم</h3>
<div class="letterText"></div>
</div>

</section>

<script>
function check(){
if(document.getElementById("pass").value==="bita"){
document.getElementById("login").style.display="none";
}
}

function typeWriter(el,text,i=0){
if(i<text.length){
el.innerHTML+=text.charAt(i);
setTimeout(()=>typeWriter(el,text,i+1),35);
}
}

function openLetter(box,text){
document.getElementById("overlay").style.display="block";
document.getElementById("paperSound").play();

document.querySelectorAll(".letter").forEach(l=>{
l.classList.remove("active");
l.querySelector(".letterText").innerHTML="";
});

box.classList.add("active");
let area=box.querySelector(".letterText");
typeWriter(area,text);

setTimeout(()=>{
document.getElementById("overlay").style.display="none";
},1200);
}

window.addEventListener("scroll",()=>{
let heart=document.createElement("div");
heart.innerHTML="❤️";
heart.style.position="fixed";
heart.style.left=Math.random()*win


dow.innerWidth+"px";
heart.style.top="0px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),2000);
});

const observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting){e.target.classList.add("show");}
});
});
document.querySelectorAll(".reveal").forEach(el=>observer.observe(el));

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let stars=[];
for(let i=0;i<120;i++){
stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height});
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";
stars.forEach(s=>ctx.fillRect(s.x,s.y,2,2));
requestAnimationFrame(draw);
}
draw();

const target=new Date("November 4, 2026 00:00:00").getTime();
setInterval(()=>{
let now=new Date().getTime();
let diff=target-now;
let d=Math.floor(diff/(1000*60*60*24));
let h=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((diff%(1000*60*60))/(1000*60));
let s=Math.floor((diff%(1000*60))/1000);
document.getElementById("countdown").innerHTML=
d+" روز "+h+" ساعت "+m+" دقیقه "+s+" ثانیه ❤️";
},1000);
</script>

</body>
</html>
